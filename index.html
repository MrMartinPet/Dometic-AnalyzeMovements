<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Analyze Movements | Dometic</title>
<link rel="stylesheet" href="styles.css?v=4"></head><body>
<div class="language-screen" id="languageScreen" role="dialog" aria-modal="true" aria-labelledby="languageTitle"><div class="language-card"><div class="brand">DOMETIC</div><div class="eyebrow" style="margin-top:12px">PROCESS OBSERVATIONS</div><h1 id="languageTitle">Choose language</h1><p>Välj språk · Sprache wählen</p><div class="languages" id="languages"></div></div></div>
<main class="app"><header class="top"><div class="brand">DOMETIC</div><div><div class="appname" data-t="app">Analyze Movements</div><div class="subtitle" data-t="tagline"></div></div><div class="spacer"></div><a href="https://mrmartinpet.github.io/Dometic/" data-t="portal"></a><button class="langbutton no-print" id="languageButton"></button></header>
<div id="message" class="message" role="alert" hidden></div>
<section class="panel setup"><label class="field"><span data-t="workstation"></span><input id="workstation" maxlength="120" data-ph="stationPlaceholder"></label><label class="field"><span data-t="observer"></span><input id="observer" maxlength="100"></label><label class="field"><span data-t="date"></span><input id="date" type="date"><span id="printDate" class="print-only" style="margin-top:5px;color:var(--ink)"></span></label></section>
<section class="stats" id="primaryStats" aria-live="off">
<div class="stat"><span data-t="duration"></span><strong id="totalDuration">00:00</strong><small id="durationNote"></small></div>
<div class="stat"><span data-t="distance"></span><strong id="totalDistance">—</strong><small id="distanceNote"></small></div>
<div class="stat"><span data-t="steps"></span><strong id="totalSteps">—</strong><small id="stepNote"></small></div>
<div class="stat"><span data-t="moves"></span><strong id="totalMoves">0</strong><small data-t="movesNote"></small></div>
<div class="stat"><span id="walkTimeLabel"></span><strong id="totalWalkTime">—</strong><small id="walkTimeNote"></small></div>
<div class="stat"><span id="walkShareLabel"></span><strong id="walkShare">—</strong><small data-t="shareNote"></small></div>
</section>
<div class="workspace"><section class="panel map-panel"><div class="map-head"><div><div class="eyebrow" data-t="diagram"></div><h2 data-t="mapTitle"></h2></div><div style="text-align:right"><div class="timer" id="timer">00:00</div><div class="status" id="status"></div><div class="status" id="targetStatus"></div></div></div>
<div class="tools no-print"><button id="addPosition" data-t="add"></button><button id="loadImage" data-t="background"></button><button id="calibrate" data-t="calibrate"></button><button id="bend" data-t="bend"></button></div>
<div class="drawing-tools no-print" aria-label="Draw layout"><strong data-t="drawLayout"></strong><button id="drawRectangle" data-t="rectangle"></button><button id="drawLine" data-t="line"></button><button id="drawLabel" data-t="label"></button><label><input id="snapLayout" type="checkbox" checked> <span data-t="magnet"></span></label><button id="finishLine" data-t="finishLine"></button><button id="undoDrawing" data-t="undoDrawing"></button></div>
<div class="board-wrap"><svg id="board" class="board" viewBox="0 0 1000 600" role="group" aria-label="Spaghetti diagram"></svg></div><div id="hint" class="hint"></div>
<div class="measure-bar no-print"><button id="start" class="primary"></button><button id="pause" data-t="pause"></button><button id="stop" data-t="stop"></button><button id="undo" data-t="undo"></button></div></section>
<aside class="side no-print"><section class="panel compact positions-panel">
<div class="section-title"><h2 data-t="positions"></h2><span id="positionCount" class="badge">0</span></div>
<div class="list-actions"><button id="loadPositions" data-t="loadPositions"></button><button id="savePositions" data-t="savePositions"></button><button id="addToList" data-t="add"></button></div>
<p class="muted" id="positionHelp" data-t="positionHelp"></p>
<div id="stations" class="stations"></div><p id="sourceInfo" class="muted"></p>
<details><summary data-t="example"></summary><button id="demo" style="width:100%;margin-top:8px" data-t="example"></button></details>
</section>
<section class="panel compact"><h2 data-t="layoutObjects"></h2><p class="muted" data-t="layoutHelp"></p><div id="layoutObjects"></div></section>
<section class="panel compact"><div class="section-title"><h2 data-t="scale"></h2><span id="scaleBadge" class="badge"></span></div><p class="muted" data-t="scaleHelp"></p><div class="scale-grid"><label class="field"><span data-t="width"></span><input id="width" type="text" inputmode="decimal" value="10"></label><label class="field"><span data-t="height"></span><input id="height" type="text" inputmode="decimal" value="6"></label><button class="full" id="applyScale" data-t="applyScale"></button></div><details><summary data-t="referenceTitle"></summary><p class="muted" data-t="referenceHelp"></p><label class="field"><span data-t="referenceLength"></span><input id="referenceLength" type="text" inputmode="decimal" value="2"></label><button id="referenceButton" style="width:100%;margin-top:8px" data-t="referenceButton"></button></details><button id="removeImage" style="width:100%;margin-top:8px" data-t="removeImage"></button></section>
<section class="panel compact"><div class="section-title"><h2 data-t="measurement"></h2></div><label class="field"><span data-t="stride"></span><input id="stride" type="text" inputmode="decimal" value="0.75"><small data-t="strideHelp"></small></label><label class="field field-gap"><span data-t="walkingSpeed"></span><input id="walkingSpeed" type="text" inputmode="decimal" value="1.2"><small data-t="speedHelp"></small></label>
<label class="field field-gap"><span data-t="targetMinutes"></span><input id="targetMinutes" type="text" inputmode="decimal" placeholder="30"><small data-t="targetHelp"></small></label>
<details><summary data-t="how"></summary><p class="muted" data-t="howText"></p></details><button id="clearRoute" style="width:100%;margin-top:12px" data-t="clearRoute"></button><button id="reset" class="danger" style="width:100%;margin-top:8px" data-t="reset"></button></section></aside></div>
<section class="panel results" id="results" hidden>
<div class="section-title"><div><div class="eyebrow" data-t="completedAnalysis"></div><h2 data-t="results"></h2></div><label class="field cycle-input"><span data-t="observedCycles"></span><input id="observedCycles" type="text" inputmode="numeric" placeholder="20"><small data-t="cycleHelp"></small></label></div>
<div class="stats secondary-stats" id="resultStats"></div>
<div class="result-tables"><div><h3 data-t="topRoutes"></h3><div id="routeSummary"></div></div><div><h3 data-t="visitsByPosition"></h3><div id="positionSummary"></div></div></div>
</section><p class="legend-note" data-t="distanceMethod"></p><div class="print-only print-info" id="printInfo"></div>
<div class="exports no-print"><button class="primary" id="print" data-t="pdf"></button><button id="csv" data-t="csv"></button><button id="svgExport" data-t="svg"></button><button id="saveProject" data-t="saveProject"></button><button id="loadProject" data-t="loadProject"></button><span class="muted" id="saveStatus" style="align-self:center;margin-left:auto"></span></div>
<section class="panel log"><div class="section-title"><h2 data-t="routeLog"></h2><span class="badge" id="logCount"></span></div><p class="print-only" id="logMetadata"></p><p class="muted no-print" data-t="logHelp"></p><div class="table-wrap" id="log"></div></section><div class="footer" data-t="footer"></div>
</main><input id="positionsFile" type="file" accept=".xlsx,.xls,.csv,.tsv" hidden><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="projectFile" type="file" accept=".json,application/json" hidden>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="app.js?v=4" defer></script></body></html>
