<div class="language-screen" id="languageScreen"><div class="language-card"><div class="brand">DOMETIC</div><div class="eyebrow" style="margin-top:12px">PROCESS OBSERVATIONS</div><h1>Choose language</h1><p>Välj språk · Sprache wählen</p><div class="languages" id="languages"></div></div></div>

<div class="tools no-print"><button id="addPosition" data-t="add"></button><button id="movePosition" data-t="move"></button><button id="loadImage" data-t="background"></button><button id="calibrate" data-t="calibrate"></button><button id="bend" data-t="bend"></button></div>

<div class="measure-bar no-print"><button id="start" class="primary"></button><button id="pause" data-t="pause"></button><button id="nextCycle" data-t="nextCycle"></button><button id="stop" data-t="stop"></button><button id="undo" data-t="undo"></button></div></section>

<section class="panel compact"><div class="section-title"><h2 data-t="measurement"></h2></div><label class="field"><span data-t="stride"></span><input id="stride" type="text" inputmode="decimal" value="0.75"><small data-t="strideHelp"></small></label><details><summary data-t="how"></summary><p class="muted" data-t="howText"></p></details><button id="clearRoute" style="width:100%;margin-top:12px" data-t="clearRoute"></button><button id="reset" class="danger" style="width:100%;margin-top:8px" data-t="reset"></button></section></aside></div>
<div id="cycleLegend" class="cycle-legend"></div><p class="legend-note" data-t="distanceMethod"></p><div class="print-only print-info" id="printInfo"></div>
<div class="exports no-print"><button class="primary" id="print" data-t="pdf"></button><button id="csv" data-t="csv"></button><button id="svgExport" data-t="svg"></button><button id="saveProject" data-t="saveProject"></button><button id="loadProject" data-t="loadProject"></button><span class="muted" id="saveStatus" style="align-self:center;margin-left:auto"></span></div>

a-label="${esc(p.name)}"><circle cx="${p.x*1000}" cy="${p.y*H}" r="${mobile?42:active?23:19}" fill="${active?'#0b9569':sel?'#1d4ed8':'#173e69'}" stroke="${active?'#6ee7b7':'#fff'}" stroke-width="3"/><text x="${p.x*1000}" y="${p.y*H+5}" text-anchor="middle" fill="#fff" font-size="${mobile?26:14}" font-weight="700">${i+1}</text><text x="${p.x*1000}" y="${p.y*H+(mobile?66:39)}" text-anchor="${p.x<.15?'start':p.x>.85?'end':'middle'}" fill="#172a43" stroke="#edf2f7" stroke-width="4" paint-order="stroke" font-size="${mobile?24:13}" font-weight="650">${esc(p.name)}</text></g>`});reference.forEach(p=>s+=`<circle cx="${p.x*1000}" cy="${p.y*H}" r="10" fill="#ef4444" stroke="#fff" stroke-width="3"/>`);b.innerHTML=s;b.querySelectorAll('[data-position]').forEach(g=>{g.onclick=e=>{e.stopPropagation();if(drag?.moved){drag=null;return}hitPosition(g.dataset.position)};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hitPosition(g.dataset.position)}};g.onpointerdown=e=>{if(!locked()&&mode==='move'){drag={id:g.dataset.position,moved:false};b.setPointerCapture(e.pointerId)}}})}
function renderPositions(){const running=project.session.status==='running';$('positionCount').textContent=project.positions.length;$('stations').innerHTML=project.positions.length?project.positions.map((p,i)=>{const visits=project.visits.filter(v=>v.position===p.id&&!v.anchor).length;return `<button class="station ${selected===p.id?'active':''}" data-station="${esc(p.id)}"><span class="number">${i+1}</span><span class="name">${esc(p.name)}</span><small>${visits} ${text('visits').toLowerCase()}</small></button>`}).join(''):`<div class="empty">${text('noPositions')}</div>`;document.querySelectorAll('[data-station]').forEach(b=>b.onclick=()=>hitPosition(b.dataset.station));const p=project.positions.find(p=>p.id===selected);$('positionEditor').hidden=!p||locked();if(p&&document.activeElement!==$('positionName'))$('positionName').value=p.name;$('movePosition').disabled=locked()||!p;$('addPosition').disabled=locked();$('loadImage').disabled=locked();$('calibrate').disabled=locked();$('removeImage').hidden=!project.image;$('removeImage').disabled=locked();$('applyScale').disabled=locked();$('referenceButton').disabled=locked();$('demo').disabled=running;}
function renderLog(){let rows=legs();$('logCount').textContent=rows.length;$('logMetadata').textContent=project.workstation+' · '+project.date+' · '+project.observer;const sig=JSON.stringify([lang,rows.map(r=>[r.b.id,r.distance,r.steps,r.b.actual,r.b.steps,visitName(r.a),visitName(r.b)])]);if(sig===lastLogSignature)return;lastLogSignature=sig;$('log').innerHTML=rows.length?`<table><thead><tr>${['seq','cycle','from','to','distance','actual','steps','countedSteps'].map(k=>`<th>${text(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.b.cycle}</td><td>${esc(visitName(r.a))}</td><td>${esc(visitName(r.b))}</td><td>${r.distance==null?'—':number(r.distance)+' m'}${r.b.actual!=null?'<span class="hint-icon"> *</span>':''}</td><td><input data-value="actual" data-visit="${r.b.id}" inputmode="decimal" aria-label="${text('actual')} ${i+1}" value="${r.b.actual==null?'':number(r.b.actual)}" placeholder="${r.layout==null?'—':number(r.layout)}"><span class="print-only print-value">${r.b.actual==null?'—':number(r.b.actual)}</span></td><td>${r.steps==null?'—':number(Math.round(r.steps),0)}${r.b.steps!=null?'<span class="hint-icon"> *</span>':''}</td><td><input data-value="steps" data-visit="${r.b.id}" inputmode="numeric" aria-label="${text('countedSteps')} ${i+1}" value="${r.b.steps??''}" placeholder="${r.distance==null?'—':Math.round(r.distance/project.stride)}"><span class="print-only print-value">${r.b.steps??'—'}</span></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${text('noMoves')}</div>`;$('log').querySelectorAll('input').forEach(e=>e.onchange=()=>{let val=e.value.trim()===''?null:parse(e.value);if(val!==null&&(!Number.isFinite(val)||val<0||val>1000000||e.dataset.value==='steps'&&!Number.isInteger(val))){e.setAttribute('aria-invalid','true');message('badNumber',true);return}const v=project.visits.find(v=>v.id===e.dataset.visit);v[e.dataset.value]=val;save();render()})}
function render(){document.documentElement.lang=lang;document.title=text('app')+' | Dometic';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=text(e.dataset.t));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=text(e.dataset.ph));$('languageButton').innerHTML=flags[lang]+' '+langNames[lang];['workstation','observer','date'].forEach(k=>{if(document.activeElement!==$(k))$(k).value=project[k]});if(document.activeElement!==$('stride'))$('stride').value=number(project.stride);if(project.metresPerUnit){if(document.activeElement!==$('width'))$('width').value=number(project.metresPerUnit*1000,4);if(document.activeElement!==$('height'))$('height').value=number(project.metresPerUnit*project.height,4)}$('saveStatus').textContent=text(saveFailed?'saveFailed':'saveOk');const st=project.session.status;$('start').textContent=text(st==='paused'?'resume':st==='done'?'newObservation':'start');$('start').disabled=st==='running';$('pause').disabled=st!=='running';$('stop').disabled=!['running','paused'].includes(st);$('nextCycle').disabled=st!=='running';$('undo').disabled=!project.visits.length||project.visits.at(-1).anchor;$('bend').disabled=st!=='running'||!project.visits.length;for(const [id,m] of [['addPosition','add'],['movePosition','move'],['referenceButton','reference'],['bend','bend']])$(id).classList.toggle('active',mode===m);$('hint').textContent=text(mode==='add'?'hintAdd':mode==='move'?'hintMove':mode==='reference'?'hintReference':mode==='bend'?'hintBend':st==='running'?'hintRunning':st==='paused'?'hintPaused':st==='done'?'hintDone':'hintIdle');renderPositions();draw();updateStats();renderLog()}
function unlocked(){if(locked()){message('locked',true);return false}return true}
function setMode(m){mode=mode===m?'select':m;reference=[];render()}
$('addPosition').onclick=()=>{if(unlocked())setMode('add')};$('movePosition').onclick=()=>{if(unlocked()){if(!selected){message('needSelection',true);return}setMode('move')}};$('calibrate').onclick=()=>{if(unlocked()){$('width').focus();$('width').scrollIntoView({behavior:'smooth',block:'center'})}};
function coordinate(e){const svg=$('board'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const t=p.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(0,Math.min(1,t.x/1000)),y:Math.max(0,Math.min(1,t.y/project.height))}}
function referenceClick(p){reference.push(p);if(reference.length===2){const refLength=parse($('referenceLength').value);if(!Number.isFinite(refLength)||refLength<=0||refLength>1000){reference=[];message('invalidReference',true);render();return}const len=Math.hypot((reference[1].x-reference[0].x)*1000,(reference[1].y-reference[0].y)*project.height);if(len<1){reference=[];message('referenceSame',true)}else{project.metresPerUnit=refLength/len;reference=[];mode='select';save();message('scaledMessage')}}render()}
$('board').onclick=e=>{let p=coordinate(e);if(mode==='reference'){referenceClick(p);return}if(mode==='add'&&unlocked()){let pos={id:uid(),name:text('defaultPosition')+' '+(project.positions.length+1),...p};project.positions.push(pos);selected=pos.id;mode='select';save();render();$('positionName').focus();$('positionName').select()}else if(mode==='move'&&unlocked()){let pos=project.positions.find(p=>p.id===selected);if(!pos){message('needSelection',true);return}Object.assign(pos,p);mode='select';save();render()}else if(mode==='bend'&&project.session.status==='running'){if(!project.visits.length){message('firstPosition',true);return}addVisit({...p,position:null,bend:project.visits.filter(v=>!v.position&&!v.anchor).length+1});render()}};
$('board').onpointermove=e=>{if(drag&&!locked()){let p=coordinate(e);const pos=project.positions.find(p=>p.id===drag.id);Object.assign(pos,p);drag.moved=true;selected=pos.id;const node=$('board').querySelector(`[data-position="${CSS.escape(pos.id)}"]`);const circle=node.querySelector('circle');circle.setAttribute('cx',pos.x*1000);circle.setAttribute('cy',pos.y*project.height);node.querySelectorAll('text').forEach((t,i)=>{t.setAttribute('x',pos.x*1000);t.setAttribute('y',pos.y*project.height+(i?39:5))})}};
$('board').onpointerup=e=>{if(drag?.moved){save();mode='select';$('board').releasePointerCapture(e.pointerId);setTimeout(()=>{drag=null;render()},0)}else drag=null};
function hitPosition(id){const p=project.positions.find(p=>p.id===id);if(mode==='reference'){referenceClick(p);return}selected=id;if(project.session.status==='running'){const last=project.visits.at(-1);if(last?.position!==id)addVisit({...p,position:id});mode='select'}render()}
function addVisit(v){project.visits.push({id:uid(),position:v.position,x:v.x,y:v.y,bend:v.bend,cycle:project.cycle,time:elapsed(),actual:null,steps:null});save()}
$('saveName').onclick=()=>{if(!unlocked())return;const name=$('positionName').value.trim();if(!name){$('positionName').setAttribute('aria-invalid','true');message('nameRequired',true);return}$('positionName').removeAttribute('aria-invalid');project.positions.find(p=>p.id===selected).name=name;save();render()};$('positionName').onkeydown=e=>{if(e.key==='Enter')$('saveName').click()};$('deletePosition').onclick=()=>{if(unlocked()&&confirm(text('deleteConfirm'))){project.positions=project.positions.filter(p=>p.id!==selected);selected=null;save();render()}};
['workstation','observer','date'].forEach(k=>$(k).oninput=()=>{project[k]=$(k).value;$(k).removeAttribute('aria-invalid');save()});
$('applyScale').onclick=()=>{if(!unlocked())return;const w=parse($('width').value),h=parse($('height').value);if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<=0||w>1000||h>1000||1000*h/w<100||1000*h/w>3000){message('scaleNumbers',true);return}if(project.image){message('referenceHelp');$('referenceLength').focus();return}project.height=1000*h/w;project.metresPerUnit=w/1000;save();message('scaledMessage');render()};
$('referenceButton').onclick=()=>{if(!unlocked())return;const n=parse($('referenceLength').value);if(!Number.isFinite(n)||n<=0||n>1000){message('invalidReference',true);return}setMode('reference')};
$('stride').oninput=()=>{const v=parse($('stride').value);$('stride').setAttribute('aria-invalid',String(!Number.isFinite(v)||v<.1||v>2))};$('stride').onchange=()=>{const v=parse($('stride').value);if(!Number.isFinite(v)||v<.1||v>2){$('stride').setAttribute('aria-invalid','true');message('invalidStride',true);return}$('stride').removeAttribute('aria-invalid');project.stride=v;save();render()};
$('bend').onclick=()=>setMode('bend');
function clearObservation(){project.visits=[];project.completed=[];project.cycle=1;project.session={status:'idle',elapsed:0,start:null};mode='select';reference=[];save();render()}
$('start').onclick=()=>{if(project.session.status==='running')return;if(project.session.status==='done'){if(!confirm(text('newConfirm')))return;clearObservation()}if(project.positions.length<2){message('needPositions',true);return}if(!project.workstation.trim()){$('workstation').setAttribute('aria-invalid','true');$('workstation').focus();message('needStation',true);return}project.session.status='running';project.session.start=Date.now();mode='select';$('message').hidden=true;save();render()};
$('pause').onclick=()=>{project.session.elapsed=elapsed();project.session.start=null;project.session.status='paused';mode='select';save();render()};
function completeCycle(){if(project.visits.at(-1)&&!project.visits.at(-1).position){message('finishPath',true);return false}if(!legs().some(r=>r.b.cycle===project.cycle)){message('noLegs',true);return false}if(!project.completed.includes(project.cycle))project.completed.push(project.cycle);return true}
$('nextCycle').onclick=()=>{if(!completeCycle())return;const last=project.visits.at(-1);project.cycle++;project.visits.push({...last,id:uid(),cycle:project.cycle,time:elapsed(),anchor:true,actual:null,steps:null});mode='select';save();render()};
$('stop').onclick=()=>{if(project.visits.at(-1)&&!project.visits.at(-1).position){message('finishPath',true);return}project.session.elapsed=elapsed();project.session.start=null;project.session.status='done';if(legs().some(r=>r.b.cycle===project.cycle))completeCycle();mode='select';save();render()};

$('clearRoute').onclick=()=>{if(confirm(text('clearConfirm'))){clearObservation();message('routeCleared')}};

$('loadImage').onclick=()=>{if(unlocked())$('imageFile').click()};
$('imageFile').onchange=async()=>{const file=$('imageFile').files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15*1024*1024){message('imageTooLarge',true);return}try{const bmp=await createImageBitmap(file);const ratio=bmp.height/bmp.width;if(ratio<.1||ratio>3)throw Error('ratio');const canvas=document.createElement('canvas');canvas.width=Math.min(bmp.width,1800);canvas.height=Math.round(canvas.width*ratio);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.86);bmp.close();if(!unlocked())return;project.image=data;project.height=1000*ratio;project.metresPerUnit=null;save();mode='select';render();message('referenceHelp')}catch{message('imageError',true)}$('imageFile').value=''};
$('removeImage').onclick=()=>{if(unlocked()){project.image=null;save();render()}};
function download(content,mime,name){const u=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function filename(ext){return 'Movements_'+(project.workstation||'analysis').replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,60)+'_'+project.date+'.'+ext}
function validInputs(){const invalid=document.querySelector('input[aria-invalid="true"]');if(invalid){invalid.focus();message(invalid.id==='stride'?'invalidStride':'badNumber',true);return false}return true}
function exportProject(){if(!validInputs())return;const copy=JSON.parse(JSON.stringify(project));copy.session={status:project.session.status==='running'?'paused':project.session.status,elapsed:elapsed(),start:null};download(JSON.stringify(copy,null,2),'application/json',filename('json'));message('fileSaved')}
$('saveProject').onclick=exportProject;$('loadProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=async()=>{const f=$('projectFile').files[0];if(!f)return;try{if(f.size>12*1024*1024)throw Error('size');const p=validate(JSON.parse(await f.text()));if(p.session.status==='running')p.session={status:'paused',elapsed:p.session.elapsed+Math.max(0,Date.now()-p.session.start),start:null};if(confirm(text('importConfirm'))){project=p;selected=null;mode='select';reference=[];lastLogSignature='';save();render();message('imported')}}catch{message('importError',true)}$('projectFile').value=''};
$('csv').onclick=()=>{if(!validInputs())return;const rows=legs();if(!rows.length){message('noData',true);return}const value=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csvNumber=n=>n==null?'':n.toFixed(4).replace(/\.?0+$/,'').replace('.',lang==='en'?'.':',');let records=[[text('app')],[text('workstation'),project.workstation],[text('observer'),project.observer],[text('date'),project.date],[text('duration'),timerText(elapsed())],[text('stride'),csvNumber(project.stride)],[text('steps'),text('stepNote')],[text('seq'),text('cycle'),text('from'),text('to'),text('distance')+' (m)',text('actual'),text('steps'),text('countedSteps')]];records[6][1]=$('stepNote').textContent;rows.forEach((r,i)=>records.push([i+1,r.b.cycle,visitName(r.a),visitName(r.b),csvNumber(r.distance),csvNumber(r.b.actual),r.steps==null?'':csvNumber(r.steps),r.b.steps??'']));const sum=totals(rows);records.push([text('distance'),csvNumber(sum.distance)],[text('steps'),csvNumber(sum.steps)],[text('cycles'),project.completed.length]);download('\ufeffsep=;\r\n'+records.map(r=>r.map(v=>value(typeof v==='string'&&/^[=+\-@\t\r]/.test(v)?"'"+v:v)).join(';')).join('\r\n'),'text/csv;charset=utf-8',filename('csv'))};
